<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Регистрация</h2>

    <form id="regForm" action="/register" method="POST" novalidate>

        <label for="sename">Фамилия</label>
        <input type="text" id="sename" name="sename" placeholder="Введите фамилию">
        <span class="error" id="senameError"></span>

        <label for="name">Имя</label>
        <input type="text" id="name" name="name" placeholder="Введите имя">
        <span class="error" id="nameError"></span>

        <label for="surname">Отчество</label>
        <input type="text" id="surname" name="surname" placeholder="Введите отчество">
        <span class="error" id="surnameError"></span>

        <label for="login">Логин</label>
        <input type="text" id="login" name="login" placeholder="Минимум 15 символов">
        <span class="error" id="loginError"></span>

        <label for="email">Email</label>
        <input type="text" id="email" name="email" placeholder="user@mail.ru">
        <span class="error" id="emailError"></span>

        <label for="age">Возраст</label>
        <input type="text" id="age" name="age" placeholder="От 18 до 99">
        <span class="error" id="ageError"></span>

        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" placeholder="Минимум 15 символов">
        <span class="error" id="passwordError"></span>

        <button type="submit">Зарегистрироваться</button>
        <p id="formMessage" class="form-message"></p>
    </form>

    <script src="script.js"></script>
</body>
</html>
